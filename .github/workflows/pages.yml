name: pages

# Deploys site/ (the landing page at / and the deck at /pitch) to GitHub Pages.
# Static only: the page carries dated snapshots with provenance, never a live CMC call —
# CoinMarketCap sends no Access-Control-Allow-Origin, so a browser cannot fetch it directly.

on:
  push:
    branches: [ "main" ]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
