name: release

# Publishes a GitHub Release for a version tag someone chose to push.
#
# This used to run on every push to main and compute the next version from the commit
# messages since the last tag. That is a reasonable default for a library with a release
# cadence, and the wrong one here: it meant the version of a hackathon submission moved
# every time a typo was fixed, and "what version is this?" had no answer anybody had
# decided. v1.0.0 is a statement that the thing is finished, and a statement should not be
# made by a regex over commit subjects.
#
#   git tag -a v1.1.0 -m "v1.1.0 — <what changed>" && git push origin v1.1.0
#
# The tag is the decision; this workflow only writes it up.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write        # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history, so the generated notes have a range to walk
      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" --generate-notes --title "$TAG"
