<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Elephant Tracks: one tall amber block beside four small blue blocks, above the flat grey bar they were summed into">
  <title>Elephant Tracks</title>

  <!-- Mechanism: "splits the tape".
       Three shapes only, so the mark survives a 16px favicon:
         1. the grey bar   = the summed before-state
         2. the amber block = one wallet, large ticket
         3. the blue row    = many wallets, small tickets
       Carries its own plate so it holds on GitHub light (#ffffff) AND dark (#0d1117). -->

  <!-- self-plate: keeps contrast on both GitHub themes -->
  <rect width="512" height="512" rx="112" fill="var(--bg, #0B0E14)"/>
  <rect x="8" y="8" width="496" height="496" rx="105" fill="none"
        stroke="var(--collapsed, #5E6C80)" stroke-width="6"/>

  <!-- 2. the elephant: one tall block, left -->
  <rect x="104" y="118" width="86" height="222" rx="10" fill="var(--elephant, #FFB020)"/>

  <!-- 3. the herd: four short blocks, right — same total area, opposite shape -->
  <g fill="var(--herd, #4C9AFF)">
    <rect x="228" y="284" width="52" height="56" rx="8"/>
    <rect x="292" y="270" width="52" height="70" rx="8"/>
    <rect x="356" y="292" width="52" height="48" rx="8"/>
    <rect x="228" y="216" width="52" height="44" rx="8" opacity=".55"/>
  </g>

  <!-- 1. the tape they were summed into: one flat bar, beneath both -->
  <rect x="104" y="374" width="304" height="20" rx="10" fill="var(--collapsed, #5E6C80)"/>
</svg>
